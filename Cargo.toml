[package]
name = "bacnet-rs"
version = "0.3.2"
edition = "2021"
rust-version = "1.88"
authors = ["bacet-rs contributors"]
description = "BACnet protocol stack implementation in Rust"
documentation = "https://docs.rs/bacnet-rs"
repository = "https://github.com/bacnet-rs/bacnet-rs.git"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["bacnet", "building-automation", "protocol", "networking", "iot"]
categories = ["network-programming", "embedded"]

[dependencies]
# Core dependencies
thiserror = { version = "2.0", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }
bitflags = { version = "2.13.2", features = ["serde"] }
pastey = "0.2.3"

# Networking
if-addrs = { version = "0.15", optional = true }

# Time handling
jiff = { version = "1.0", default-features = false, optional = true }

# Legacy BACnet CharacterString charsets (DBCS code pages, JIS X 0208)
encoding_rs = { version = "0.8", optional = true }
oem_cp = { version = "2.1", optional = true }

[dev-dependencies]
criterion = "0.8"
proptest = "1.12"
ctrlc = "3.5"

[features]
default = ["std", "serde"]
std = [
    "thiserror",
    "serde?/std",
    "if-addrs",
    "jiff/std",
    "jiff/tz-system",
    "jiff/tzdb-zoneinfo",
    "jiff/tzdb-concatenated",
    "jiff/tzdb-bundle-platform",
]
no-std = []
legacy-charsets = ["encoding_rs", "oem_cp"]

# Basic examples
[[example]]
name = "responder_device"
path = "examples/basic/responder_device.rs"
required-features = ["std"]

# Networking examples
[[example]]
name = "whois_scan"
path = "examples/networking/whois_scan.rs"
required-features = ["std"]

[[example]]
name = "routed_device_discovery"
path = "examples/networking/routed_device_discovery.rs"
required-features = ["std"]

# Object examples
[[example]]
name = "device_objects"
path = "examples/objects/device_objects.rs"
required-features = ["std"]

[[example]]
name = "object_database"
path = "examples/objects/object_database.rs"
required-features = ["std"]

# Communication examples
[[example]]
name = "test_client"
path = "examples/communication/test_client.rs"
required-features = ["std"]

[[example]]
name = "read_write_property"
path = "examples/communication/read_write_property.rs"
required-features = ["std"]

# Utility examples
[[example]]
name = "util_demo"
path = "examples/utilities/util_demo.rs"
required-features = ["std"]

[[example]]
name = "vendor_lookup"
path = "examples/utilities/vendor_lookup.rs"
required-features = ["std"]

[[bench]]
name = "encoding"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
